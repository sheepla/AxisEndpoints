name: Publish to NuGet

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Run tests
        run: dotnet test --configuration Release --no-build

      - name: Pack AxisEndpoints
        run: dotnet pack src/AxisEndpoints/AxisEndpoints.csproj --configuration Release --no-build /p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkgs

      - name: Pack AxisEndpoints.Extensions.CsvHelper
        run: dotnet pack src/AxisEndpoints.Extensions.CsvHelper/AxisEndpoints.Extensions.CsvHelper.csproj --configuration Release --no-build /p:Version=${{ steps.version.outputs.VERSION }} --output ./nupkgs

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
